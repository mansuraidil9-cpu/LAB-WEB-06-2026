<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantau Tugas Tim</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

  <header class="bg-indigo-700 text-white">
    <div class="mx-auto max-w-5xl px-4 py-6">
      <h1 class="text-2xl font-bold">Pantau Tugas Tim</h1>
      <p class="text-sm text-indigo-100">Pilih anggota untuk melihat siapa mengerjakan apa.</p>
    </div>
  </header>

  <main class="mx-auto grid max-w-5xl gap-6 px-4 py-6 md:grid-cols-3">

    <!-- Daftar anggota (F1) -->
    <section class="md:col-span-1">
      <h2 class="mb-3 text-lg font-semibold">Anggota Tim</h2>
      <p id="statusAnggota" class="text-sm text-slate-500"></p>
      <p id="errorAnggota" class="hidden rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-700"></p>
      <div id="daftarAnggota" class="flex flex-col gap-2"></div>
    </section>

    <!-- Tugas anggota (F2 - F5) -->
    <section class="md:col-span-2">
      <h2 id="judulTugas" class="mb-3 text-lg font-semibold">Tugas</h2>

      <p id="petunjukAwal" class="rounded-md border border-dashed border-slate-300 bg-white p-4 text-sm text-slate-500">
        Klik salah satu nama anggota untuk menampilkan tugasnya.
      </p>
      <p id="statusTugas" class="hidden text-sm text-slate-500"></p>
      <p id="errorTugas" class="hidden rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-700"></p>

      <div id="areaTugas" class="hidden">

        <!-- Ringkasan progres -->
        <div class="mb-4 rounded-lg bg-white p-4 shadow-sm">
          <p id="ringkasan" class="text-sm font-medium"></p>
          <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-slate-200">
            <div id="barProgres" class="h-2 rounded-full bg-green-500 transition-all" style="width: 0%"></div>
          </div>
        </div>

        <!-- Form tambah tugas (F4) -->
        <form id="formTugas" class="mb-4 rounded-lg bg-white p-4 shadow-sm" novalidate>
          <label for="inputJudul" class="mb-1 block text-sm font-medium">Tambah tugas baru</label>
          <div class="flex flex-col gap-2 sm:flex-row">
            <input id="inputJudul" type="text" autocomplete="off" placeholder="Judul tugas (minimal 5 karakter)"
              class="flex-1 rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            <button id="tombolSimpan" type="submit"
              class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-60">
              Simpan
            </button>
          </div>
          <p id="pesanForm" class="mt-2 min-h-[1.25rem] text-sm text-red-600"></p>
        </form>

        <!-- Pencarian (F3) -->
        <div class="mb-3">
          <label for="inputCari" class="mb-1 block text-sm font-medium">Cari tugas</label>
          <input id="inputCari" type="search" autocomplete="off" placeholder="Ketik kata kunci judul..."
            class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
        </div>

        <ul id="daftarTugas" class="flex flex-col gap-2"></ul>
        <p id="pesanKosong" class="hidden rounded-md bg-white p-4 text-sm text-slate-500 shadow-sm"></p>
      </div>
    </section>
  </main>

  <!-- Notifikasi (F4.5) -->
  <div id="notifikasi" role="status"
    class="hidden fixed bottom-4 right-4 rounded-md bg-green-600 px-4 py-3 text-sm font-medium text-white shadow-lg"></div>

  <script src="script.js"></script>
</body>
</html>
